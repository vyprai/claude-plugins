services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    # DATABASE_PATH is deliberately unset, so a cold boot fails the way a real
    # repository fails: on state the developer has and the checkout does not.
    command: sh -c "pip install --quiet flask && flask --app app run --host 0.0.0.0"
